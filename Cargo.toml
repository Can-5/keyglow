[package]
name = "keyglow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keyboard-glow/animation domain logic for Orbit: transient key-code stats, typing rate, profiles. Never stores or sees typed characters."
repository = "https://github.com/Can-5/keyglow"
keywords = ["keyboard", "rgb", "orbit"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
